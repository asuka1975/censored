name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ブランチ名を run: に直接展開しない(スクリプト注入の防止)。
  BASE: origin/${{ github.base_ref || 'main' }}

jobs:
  repo-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 基準ブランチを取得する
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
      - run: make lint-repo lint-md BASE="$BASE"

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 固定版を読み込む
        id: versions
        run: grep -E '^(GHC|CABAL)=' tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ steps.versions.outputs.GHC }}
          cabal-version: ${{ steps.versions.outputs.CABAL }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ICU の開発ファイルを導入する
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev pkg-config
      # WHY NOT: ICU の版をキーに含めずにキャッシュを共有しない。主版が変わると、キャッシュの text-icu が
      # 古い共有ライブラリを指したまま残り、リンクかテストで落ちる。キャッシュの復元より前に版を読む。
      - name: ICU の版を読む
        id: icu
        run: |
          version=$(pkg-config --modversion icu-i18n)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/.cabal/store
            ~/.cabal/packages
            ~/.local/state/cabal/store
            ~/.cache/cabal/packages
          key: hs-icu${{ steps.icu.outputs.version }}-${{ hashFiles('tools/versions.env', 'backend/cabal.project', 'backend/cabal.project.freeze') }}
          restore-keys: hs-icu${{ steps.icu.outputs.version }}-
      - run: tools/setup-toolchain.sh
      - name: 基準ブランチを取得する
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
      - run: make lint-hs build-hs coverage-hs weeder BASE="$BASE"
      - name: API 契約の生成物がコミットと一致する
        run: make contract-check
      - name: 依存ライセンスを検査する
        run: make licenses LICENSE_SCOPE=hackage
      - name: 変更箇所のミューテーション
        if: github.event_name == 'pull_request'
        run: make mutation-diff-hs BASE="$BASE"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 基準ブランチを取得する
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
      - run: make lint-ps coverage-ps BASE="$BASE"
      - name: 依存ライセンスを検査する
        run: make licenses LICENSE_SCOPE=npm,purescript
      - name: 変更箇所のミューテーション
        if: github.event_name == 'pull_request'
        run: make mutation-diff-ps BASE="$BASE"

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 検査ツールを取得する
        run: |
          source tools/versions.env
          mkdir -p .tools/bin
          curl -fsSL -o .tools/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  .tools/bin/osv-scanner" | sha256sum -c -
          chmod +x .tools/bin/osv-scanner
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C .tools/bin gitleaks
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz -C .tools/bin actionlint
      - run: make lint-actions vulns secrets
